<VirtualHost *:80>
	# The ServerName directive sets the request scheme, hostname and port that
	# the server uses to identify itself. This is used when creating
	# redirection URLs. In the context of virtual hosts, the ServerName
	# specifies what hostname must appear in the request's Host: header to
	# match this virtual host. For the default virtual host (this file) this
	# value is not decisive as it is used as a last resort host regardless.
	# However, you must set it for any further virtual host explicitly.
	ServerName planwatch.org
	ServerAlias www.planwatch.org
	ServerAlias m.planwatch.org
	ServerAlias d.planwatch.org

	ServerAdmin josh@planwatch.org
	DocumentRoot /var/www/planwatch.org/public_html

	# Available loglevels: trace8, ..., trace1, debug, info, notice, warn,
	# error, crit, alert, emerg.
	# It is also possible to configure the loglevel for particular
	# modules, e.g.
	#LogLevel info ssl:warn

	ErrorLog ${APACHE_LOG_DIR}/error-planwatch.log
	CustomLog ${APACHE_LOG_DIR}/access-planwatch.log combined

	# For most configuration files from conf-available/, which are
	# enabled or disabled at a global level, it is possible to
	# include a line for only one particular virtual host. For example the
	# following line enables the CGI configuration for this host only
	# after it has been globally disabled with "a2disconf".
	#Include conf-available/serve-cgi-bin.conf

	ErrorDocument 404 /scripts/parseurl.php
	ErrorDocument 403 /scripts/parseurl.php

	#see /var/www/planwatch.org/public_html/.user.ini for additional directives

		RewriteEngine On
		RewriteRule ^backend - [L,NC]
		RewriteCond %{SERVER_NAME} =www.planwatch.org [OR]
		RewriteCond %{SERVER_NAME} =m.planwatch.org [OR]
		RewriteCond %{SERVER_NAME} =planwatch.org [OR]
		RewriteCond %{SERVER_NAME} =d.planwatch.org
		RewriteRule https://planwatch.org%{REQUEST_URI} [END,NE,R=permanent]

	<directory /var/www/planwatch.org/public_html>		
		Allow from All
		Options -Indexes +FollowSymLinks
		FallbackResource /scripts/parseurl.php
		DirectoryIndex index.php
	</directory>
	<directory /var/www/planwatch.org/pwusers>
		Deny from All
	</directory>
	<directory /var/www/planwatch.org/sessions>
		Deny from All
	</directory>




		

RewriteCond %{SERVER_NAME} =d.planwatch.org [OR]
RewriteCond %{SERVER_NAME} =planwatch.org [OR]
RewriteCond %{SERVER_NAME} =m.planwatch.org [OR]
RewriteCond %{SERVER_NAME} =www.planwatch.org
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

# vim: syntax=apache ts=4 sw=4 sts=4 sr noet
