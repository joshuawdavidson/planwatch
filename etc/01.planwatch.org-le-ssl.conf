<VirtualHost *:443>
	ServerName planwatch.org
	ServerAlias www.planwatch.org
	ServerAlias m.planwatch.org
	ServerAlias d.planwatch.org

	ServerAdmin josh@planwatch.org
	DocumentRoot /var/www/planwatch.org/public_html

	ErrorLog ${APACHE_LOG_DIR}/error-planwatch.log
	CustomLog ${APACHE_LOG_DIR}/access-planwatch.log combined

	Header always set Strict-Transport-Security "max-age=300000"
	Header always set Access-Control-Allow-Origin "https://planwatch.org"
	Header always set Access-Control-Allow-Origin "https://www.planwatch.org"
	Header always set Access-Control-Allow-Headers "Authorization,X-Requested-With,Accept,Origin"
	Header always set Access-Control-Allow-Methods "GET"
	Header always set Access-Control-Allow-Methods "POST"
	Header always set Access-Control-Expose-Headers "Content-Security-Policy, Location"
	Header always set Access-Control-Max-Age "600"

	errordocument 404 /scripts/parseurl.php
	errordocument 403 /scripts/parseurl.php

	#php values have been moved to /var/www/planwatch.org/public_html/.user.ini
	#because of php-fpm

	<directory /var/www/planwatch.org/public_html>
		Options -Indexes +FollowSymLinks
		FallbackResource /scripts/parseurl.php
		DirectoryIndex index.php
	</directory>
	<directory /var/www/planwatch.org/sessions>
		Deny from All
	</directory>
	<directory /var/www/planwatch.org/pwusers>
		Deny from All
	</directory>
	<Files ".user.ini">
		Require all denied
	</Files>

	RewriteEngine On
	RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
	RewriteRule ^(.*)$ /scripts/parseurl.php?urlstring=$1 [B,L]

	Include /etc/letsencrypt/options-ssl-apache.conf
	SSLCertificateFile /etc/letsencrypt/live/planwatch.org/fullchain.pem
	SSLCertificateKeyFile /etc/letsencrypt/live/planwatch.org/privkey.pem
</VirtualHost>

<VirtualHost *:80>
	ServerName planwatch.org
	ServerAlias www.planwatch.org
	ServerAlias m.planwatch.org
	ServerAlias d.planwatch.org

	ServerAdmin josh@planwatch.org
	DocumentRoot /var/www/planwatch.org/public_html

	ErrorLog ${APACHE_LOG_DIR}/error-planwatch.log
	CustomLog ${APACHE_LOG_DIR}/access-planwatch.log combined

	ErrorDocument 404 /scripts/parseurl.php
	ErrorDocument 403 /scripts/parseurl.php

	RewriteEngine On
	RewriteRule ^backend - [L,NC]
	RewriteCond %{SERVER_NAME} =www.planwatch.org [OR]
	RewriteCond %{SERVER_NAME} =m.planwatch.org [OR]
	RewriteCond %{SERVER_NAME} =planwatch.org [OR]
	RewriteCond %{SERVER_NAME} =d.planwatch.org
	RewriteRule https://planwatch.org%{REQUEST_URI} [END,NE,R=permanent]

	<directory /var/www/planwatch.org/public_html>
		Allow from All
		Options -Indexes +FollowSymLinks
		FallbackResource /scripts/parseurl.php
		DirectoryIndex index.php
	</directory>
	<directory /var/www/planwatch.org/pwusers>
		Deny from All
	</directory>
	<directory /var/www/planwatch.org/sessions>
		Deny from All
	</directory>

</VirtualHost>
